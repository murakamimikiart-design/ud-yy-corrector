<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDトーク × YYprobe 修正補助</title>
<style>
  :root{
    --bg:#161a1f; --panel:#0e1216; --line:#2c333a; --fg:#e9edf1; --dim:#93a2b1;
    --ud:#e8a33d; --yy:#5fb37a; --cus:#7aa9ff; --accent:#2f7de1; --ts:17px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         padding:10px 14px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;font-weight:700}
  .spacer{flex:1}
  button{font:inherit;font-size:14px;padding:6px 12px;border-radius:7px;
         border:1px solid var(--line);background:#222a31;color:var(--fg);cursor:pointer}
  button:hover{background:#2b343d}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.decide{background:#2e7d46;border-color:#3c9a59;color:#fff;font-weight:700;font-size:15px}
  label.chk{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer}
  main{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 14px;overflow:hidden}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
  .row.inputs{flex:.62} .row.mid{flex:1.9}
  .pane{display:flex;flex-direction:column;min-height:0}
  .pane h2{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .pane h2 .tag{font-weight:700}
  .ud .tag{color:var(--ud)} .yy .tag{color:var(--yy)}
  .pane h2 .sub{color:var(--dim);font-weight:400;font-size:12px}
  textarea,.box{flex:1;min-height:0;width:100%;background:var(--panel);color:var(--fg);
       border:1px solid var(--line);border-radius:9px;padding:10px 12px;
       font:inherit;font-size:var(--ts);line-height:1.75;resize:none;overflow:auto}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}

  /* 修正候補 */
  #list{padding:8px}
  .chg{border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin:0 0 7px;
       background:#151b21}
  .opts{display:flex;gap:7px;flex-wrap:wrap;align-items:stretch}
  .no{flex:0 0 auto;display:flex;align-items:center;padding:0 2px;
      font-size:12px;color:var(--dim)}
  .opt{flex:1;min-width:120px;text-align:left;font-size:var(--ts);line-height:1.5;
       padding:7px 10px;border-radius:7px;border:1px solid var(--line);
       background:#1b232b;color:var(--fg);cursor:pointer}
  .opt .who{display:block;font-size:11px;letter-spacing:.04em;margin-bottom:2px;color:var(--dim)}
  .opt.udopt.sel{background:#4a3410;border-color:var(--ud);box-shadow:inset 0 0 0 1px var(--ud)}
  .opt.udopt.sel .who{color:var(--ud)}
  .opt.yyopt.sel{background:#14432a;border-color:var(--yy);box-shadow:inset 0 0 0 1px var(--yy)}
  .opt.yyopt.sel .who{color:var(--yy)}
  .opt.edit{flex:0 0 auto;min-width:0;padding:7px 11px;font-size:15px}
  .opt.edit.sel{background:#1b3358;border-color:var(--cus);box-shadow:inset 0 0 0 1px var(--cus)}
  .none{color:var(--dim);font-style:italic}
  .ci[hidden]{display:none}
  .ci{display:block;width:100%;margin-top:7px;padding:7px 10px;border-radius:7px;
      border:1px solid var(--cus);background:#0d1622;color:var(--fg);font:inherit;font-size:var(--ts)}
  .empty{color:var(--dim);padding:10px;font-size:14px}

  /* プレビュー */
  mark{border-radius:3px;padding:1px 2px}
  mark.yy{background:#1d4d2e;color:#c9f7d5}
  mark.cus{background:#1b3358;color:#cfe0ff}
  .out{flex:.62;display:flex;flex-direction:column;min-height:0}
  footer{padding:9px 14px;border-top:1px solid var(--line);background:#0b0e11;
         color:var(--dim);font-size:14px}
  footer.warn{color:#ffd479} footer.ok{color:#7ee2a0}
  .legend{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
  .legend i{font-style:normal;padding:1px 6px;border-radius:4px}
  .legend .l-ud{background:#4a3410;color:#ffcf8a}
  .legend .l-yy{background:#14432a;color:#a9e9c1}
  .legend .l-cus{background:#1b3358;color:#cfe0ff}
</style>
</head>
<body>
<header>
  <h1>UDトーク × YYprobe 修正補助</h1>
  <label class="chk"><input type="checkbox" id="autoChk" checked>自動で比較</label>
  <label class="chk"><input type="checkbox" id="punctChk" checked>句読点の違いは無視</label>
  <label class="chk"><input type="checkbox" id="minorChk">言い回しの差も表示</label>
  <span class="spacer"></span>
  <button id="sampleBtn">サンプル読込</button>
  <button id="smallBtn">小さく －</button>
  <button id="bigBtn">大きく ＋</button>
  <button id="resetBtn">リセット</button>
</header>

<main>
  <div class="row inputs">
    <div class="pane ud">
      <h2><span class="tag">UDトーク</span><span class="sub">公開に使う側 — ここに貼り付け（⌘V）</span></h2>
      <textarea id="ud" placeholder="UDトークの文字起こしを貼り付け"></textarea>
    </div>
    <div class="pane yy">
      <h2><span class="tag">YYprobe</span><span class="sub">もう一方の認識結果 — ここに貼り付け（⌘V）</span></h2>
      <textarea id="yy" placeholder="YYprobe の文字起こしを貼り付け"></textarea>
    </div>
  </div>

  <div class="row mid">
    <div class="pane">
      <h2>どちらが正しい？<span class="sub">食い違った箇所ごとに選ぶ。両方違えば ✎ で入力</span></h2>
      <div id="list" class="box"></div>
      <div class="btns">
        <button id="allUd">全部 UD</button>
        <button id="allYy">全部 YY</button>
        <button data-clear="ud">UD欄クリア</button>
        <button data-clear="yy">YY欄クリア</button>
      </div>
    </div>
    <div class="pane">
      <h2>公開される文<span class="sub">選んだ結果</span></h2>
      <div id="preview" class="box"></div>
      <div class="btns legend">
        <span><i class="l-ud">無印</i> UDのまま</span>
        <span><i class="l-yy">緑</i> YYを採用</span>
        <span><i class="l-cus">青</i> 自分で入力</span>
      </div>
    </div>
  </div>

  <div class="pane out">
    <h2>最終テキスト<span class="sub">ここを直接書き換えてもOK</span></h2>
    <textarea id="out"></textarea>
    <div class="btns">
      <button id="decideBtn" class="decide">これで決定 → コピー（⌘Return）</button>
      <button id="nextBtn">UD欄に反映して次へ</button>
    </div>
  </div>
</main>

<footer id="status">両方のテキストを貼り付けてください（左＝UDトーク／右＝YYprobe）</footer>

<script>
"use strict";

/* ---------------- 差分ロジック（diff_engine.py と同じ考え方） ---------------- */

const IGNORE_PUNCT = new Set("、。，．,.！？!?…‥・「」『』（）()〈〉《》【】〔〕”“\"'‘’；;：:".split(""));

function fold(text, ignorePunct, ignoreSpace){
  const chars = [], origin = [];
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (ignoreSpace && /\s/.test(ch)) continue;
    if (ignorePunct && IGNORE_PUNCT.has(ch)) continue;
    for (const c of ch.normalize("NFKC")){
      if (ignoreSpace && /\s/.test(c)) continue;
      chars.push(c); origin.push(i);
    }
  }
  return {s: chars.join(""), origin};
}

function rawOpcodes(a, b){
  const n = a.length, m = b.length;
  if (n === 0 && m === 0) return [];
  if (n === 0) return [[0, 0, 0, m]];
  if (m === 0) return [[0, n, 0, 0]];
  const w = m + 1;
  const dp = new Uint32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i * w + j] = a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1
                                    : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
  const ops = [];
  let i = 0, j = 0, si = 0, sj = 0, inDiff = false;
  const close = () => { if (inDiff){ ops.push([si, i, sj, j]); inDiff = false; } };
  while (i < n && j < m){
    if (a[i] === b[j]){ close(); i++; j++; }
    else {
      if (!inDiff){ si = i; sj = j; inDiff = true; }
      if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) i++; else j++;
    }
  }
  if (i < n || j < m){ if (!inDiff){ si = i; sj = j; inDiff = true; } i = n; j = m; }
  close();
  return ops;
}

function mergeOps(ops, gap){
  const out = [];
  for (const [i1, i2, j1, j2] of ops){
    if (out.length){
      const p = out[out.length - 1];
      if ((i1 - p[1]) <= gap && (j1 - p[3]) <= gap){ p[1] = i2; p[3] = j2; continue; }
    }
    out.push([i1, i2, j1, j2]);
  }
  return out;
}

function toOrigin(origin, len, i1, i2){
  const start = i1 < origin.length ? origin[i1] : len;
  const end   = i2 < origin.length ? origin[i2] : len;
  return [start, Math.max(start, end)];
}

function similarity(a, b, ops){
  const total = a.length + b.length;
  if (total === 0) return 1;
  let d = 0;
  for (const [i1, i2, j1, j2] of ops) d += (i2 - i1) + (j2 - j1);
  return Math.max(0, (total - d) / total);
}

function compare(ud, yy, ignorePunct = true, gap = 1){
  const A = fold(ud, ignorePunct, true), B = fold(yy, ignorePunct, true);
  if (A.s.length * B.s.length > 4000000) return {ud, yy, changes: [], similarity: 1, tooLong: true};
  const ops = mergeOps(rawOpcodes(A.s, B.s), gap);
  const changes = ops.map(([i1, i2, j1, j2], k) => {
    const [us, ue] = toOrigin(A.origin, ud.length, i1, i2);
    const [ys, ye] = toOrigin(B.origin, yy.length, j1, j2);
    return {
      index: k + 1,
      ud: ud.slice(us, ue), yy: yy.slice(ys, ye),
      udStart: us, udEnd: ue,
      choice: "yy",        // 既定は YY。UD が正しければクリックで切り替える
      custom: ""
    };
  });
  return {ud, yy, changes, similarity: similarity(A.s, B.s, ops)};
}

// 選んだ結果を UD 原文に当てる。spans は色分け用 [start, end, 'yy'|'cus']
function applyChoices(ud, changes){
  let out = "", cursor = 0;
  const spans = [];
  for (const c of [...changes].sort((x, y) => x.udStart - y.udStart)){
    if (c.udStart < cursor) continue;
    if (c.choice === "ud") continue;                 // UD のまま＝手を加えない
    const text = c.choice === "custom" ? c.custom : c.yy;
    out += ud.slice(cursor, c.udStart);
    const start = out.length;
    out += text;
    if (text) spans.push([start, out.length, c.choice === "custom" ? "cus" : "yy"]);
    cursor = c.udEnd;
  }
  out += ud.slice(cursor);
  return {text: out, spans};
}

/* 重要な差分かどうか。
   実データで検証したところ、30秒で19箇所も出た。その多くは「ね、」「って」
   「と思うんですけど」のような言い回し・助詞の差で、UDが拾いきれなかっただけの箇所。
   一方で直すべきなのは「車学習者→手話学習者」「送り歯→コクリハ」のような
   語そのものの誤り。漢字・カタカナ・数字・英字を含むかどうかで振り分ける。 */
const KANA_ONLY = /^[\u3040-\u309F\u30FC、。，．・…「」『』（）()？！?!\s]*$/;
function isMinor(c){ return KANA_ONLY.test(c.ud) && KANA_ONLY.test(c.yy); }

/* ---------------- 練習用サンプル ---------------- */
const SAMPLES = [
  {title:"他者発話の聞き違い（同音異義）",
   ud:"きょうわ、いい転記ですね。田中さんが以下です。",
   yy:"今日は、いい天気ですね。田中さんが行かれます。"},
  {title:"固有名詞の誤認識",
   ud:"村上みきさんの発表を始めます。",
   yy:"村上美樹さんの発表を始めます。"},
  {title:"脱落（UDが拾えなかった）",
   ud:"それでは質疑応答に移ります。",
   yy:"それでは、ここから質疑応答に移ります。挙手をお願いします。"},
  {title:"余分な聞き取り（環境音・重複）",
   ud:"あの、えー、資料の3ページをご覧ください。ください。",
   yy:"資料の3ページをご覧ください。"},
  {title:"YY側が間違っている例（UDを選ぶ）",
   ud:"UDトークとYYprobeを併用します。",
   yy:"UDトークとワイワイプローブを併用します。"},
  {title:"両方まちがっている例（✎で入力）",
   ud:"次は情報保証について話します。",
   yy:"次は情報補償について話します。"},
  {title:"複数行・専門用語",
   ud:"情報保証の観点から考えると\n用途トークは標準的なツールです\nしかし精度に課題があります",
   yy:"情報保障の観点から考えると\nUDトークは標準的なツールです\nしかし精度に課題があります"},
  {title:"一致（修正不要）",
   ud:"本日はお集まりいただきありがとうございます。",
   yy:"本日はお集まりいただきありがとうございます。"}
];

/* ---------------- 画面 ---------------- */
const $ = id => document.getElementById(id);
const udEl = $("ud"), yyEl = $("yy"), outEl = $("out");
const listEl = $("list"), prevEl = $("preview"), statusEl = $("status");
const autoChk = $("autoChk"), punctChk = $("punctChk"), minorChk = $("minorChk");
let result = null, sampleIdx = 0, fontSize = 17, timer = null;

const esc = s => s.replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function setStatus(text, cls){ statusEl.textContent = text; statusEl.className = cls || ""; }

function optButton(cls, who, text, emptyLabel){
  const b = document.createElement("button");
  b.className = "opt " + cls;
  const w = document.createElement("span");
  w.className = "who"; w.textContent = who;
  b.appendChild(w);
  if (text) b.appendChild(document.createTextNode(text));
  else {
    const em = document.createElement("span");
    em.className = "none"; em.textContent = emptyLabel;
    b.appendChild(em);
  }
  return b;
}

function buildList(){
  listEl.innerHTML = "";
  if (!result || !result.changes.length){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = (result && result.ud.trim() && result.yy.trim())
      ? "食い違いはありません。UDトークのままで大丈夫です。"
      : "両方に貼り付けると、食い違った箇所がここに並びます。";
    listEl.appendChild(d);
    return;
  }
  const showMinor = minorChk.checked;
  const hidden = result.changes.filter(c => isMinor(c) && !showMinor).length;
  if (hidden){
    const n = document.createElement("div");
    n.className = "empty";
    n.textContent = `言い回しの差 ${hidden} 件は非表示（YY側を採用して結果に反映済み）。` +
                    `上の「言い回しの差も表示」で確認できます。`;
    listEl.appendChild(n);
  }
  result.changes.forEach(c => {
    if (isMinor(c) && !showMinor) return;
    const row = document.createElement("div");
    row.className = "chg";

    const no = document.createElement("div");
    no.className = "no"; no.textContent = c.index;

    const opts = document.createElement("div");
    opts.className = "opts";
    const bUd = optButton("udopt", "UDトーク", c.ud, "（入れない）");
    const bYy = optButton("yyopt", "YYprobe", c.yy, "（削除する）");
    const bEd = document.createElement("button");
    bEd.className = "opt edit"; bEd.textContent = "✎"; bEd.title = "自分で入力";
    opts.append(no, bUd, bYy, bEd);
    row.appendChild(opts);

    const ci = document.createElement("input");
    ci.className = "ci"; ci.type = "text"; ci.hidden = true;
    ci.placeholder = "正しい言葉を入力";
    row.appendChild(ci);

    const paint = () => {
      bUd.classList.toggle("sel", c.choice === "ud");
      bYy.classList.toggle("sel", c.choice === "yy");
      bEd.classList.toggle("sel", c.choice === "custom");
      ci.hidden = c.choice !== "custom";
    };
    const pick = mode => { c.choice = mode; paint(); render(); };

    bUd.addEventListener("click", () => pick("ud"));
    bYy.addEventListener("click", () => pick("yy"));
    bEd.addEventListener("click", () => {
      if (!c.custom) c.custom = c.yy || c.ud;
      ci.value = c.custom;
      pick("custom");
      ci.focus(); ci.select();
    });
    ci.addEventListener("input", () => { c.custom = ci.value; render(); });
    paint();
    listEl.appendChild(row);
  });
}

function render(){
  if (!result) return;
  const {text, spans} = applyChoices(result.ud, result.changes);

  let html = "", cursor = 0;
  for (const [s, e, kind] of spans){
    html += esc(text.slice(cursor, s)) + `<mark class="${kind}">` + esc(text.slice(s, e)) + "</mark>";
    cursor = e;
  }
  html += esc(text.slice(cursor));
  prevEl.innerHTML = html.replace(/\n/g, "<br>") || '<span class="empty">（ここに公開される文が出ます）</span>';
  outEl.value = text;

  const hasUd = result.ud.trim(), hasYy = result.yy.trim(), n = result.changes.length;
  const cnt = {ud: 0, yy: 0, custom: 0};
  result.changes.forEach(c => cnt[c.choice]++);
  if (result.tooLong) setStatus("テキストが長すぎます。数文ずつに分けて貼り付けてください。", "warn");
  else if (!hasUd && !hasYy) setStatus("両方のテキストを貼り付けてください（左＝UDトーク／右＝YYprobe）");
  else if (!hasYy) setStatus("YYprobe のテキストを右に貼り付けてください", "warn");
  else if (!hasUd) setStatus("UDトークのテキストを左に貼り付けてください", "warn");
  else if (n === 0) setStatus("✓ 食い違いなし。UDトークのままで大丈夫です。", "ok");
  else {
    const minor = result.changes.filter(isMinor).length;
    setStatus(`食い違い ${n} 箇所（要判断 ${n - minor}／言い回し ${minor}）　→　` +
              `UD採用 ${cnt.ud}／YY採用 ${cnt.yy}／自分で入力 ${cnt.custom}　` +
              `（一致率 ${(result.similarity * 100).toFixed(1)}%）`);
  }
}

function runCompare(){
  timer = null;
  const ud = udEl.value, yy = yyEl.value;
  result = yy.trim() ? compare(ud, yy, punctChk.checked)
                     : {ud, yy, changes: [], similarity: 1};
  buildList();
  render();
}

function schedule(){
  if (!autoChk.checked) return;
  clearTimeout(timer);
  timer = setTimeout(runCompare, 200);
}

udEl.addEventListener("input", schedule);
yyEl.addEventListener("input", schedule);
punctChk.addEventListener("change", runCompare);
minorChk.addEventListener("change", () => { buildList(); render(); });

document.querySelectorAll("[data-clear]").forEach(b =>
  b.addEventListener("click", () => { $(b.dataset.clear).value = ""; runCompare(); }));

function setAll(mode){
  if (!result) return;
  result.changes.forEach(c => c.choice = mode);
  buildList(); render();
}
$("allUd").addEventListener("click", () => setAll("ud"));
$("allYy").addEventListener("click", () => setAll("yy"));

$("sampleBtn").addEventListener("click", () => {
  const s = SAMPLES[sampleIdx % SAMPLES.length];
  sampleIdx++;
  udEl.value = s.ud; yyEl.value = s.yy;
  runCompare();
  setStatus(`サンプル: ${s.title}　／　${statusEl.textContent}`);
});

$("resetBtn").addEventListener("click", () => {
  udEl.value = ""; yyEl.value = ""; outEl.value = "";
  runCompare(); udEl.focus();
});

$("nextBtn").addEventListener("click", () => {
  udEl.value = outEl.value; yyEl.value = "";
  runCompare(); yyEl.focus();
});

$("decideBtn").addEventListener("click", decide);
function decide(){
  const text = outEl.value;
  if (!text.trim()){ setStatus("決定する内容がありません。", "warn"); return; }
  const done = () => setStatus("✓ 決定してコピーしました。UDトークに貼り付けてください。", "ok");
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
  function fallback(){
    outEl.select();
    try { document.execCommand("copy"); done(); }
    catch(e){ setStatus("コピーできませんでした。最終テキスト欄を選んで ⌘C を押してください。", "warn"); }
  }
}

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){ e.preventDefault(); decide(); }
});

function setFont(px){
  fontSize = Math.max(13, Math.min(30, px));
  document.documentElement.style.setProperty("--ts", fontSize + "px");
}
$("bigBtn").addEventListener("click", () => setFont(fontSize + 1));
$("smallBtn").addEventListener("click", () => setFont(fontSize - 1));

runCompare();
udEl.focus();
</script>
